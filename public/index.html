<style>
:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f6f8;--brand:#1f2937;--user:#eef5ff;--user-border:#cfe0ff;--ok:#15803d;--warn:#b45309;--danger:#b91c1c}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:8px 10px 90px}.nav{position:sticky;top:0;z-index:8;background:#f3f4f6;padding:6px 0 10px;display:flex;gap:6px;overflow:auto}.nav button{white-space:nowrap;border:0;border-radius:12px;padding:10px 12px;background:#fff;color:#374151}.nav button.active{background:#111827;color:#fff}.card{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 12px #0000000b}.hero{background:#111827;color:#fff;border-radius:22px;padding:20px;margin:6px 0 12px}.hero h1{margin:0 0 6px;font-size:25px}.hero .muted{color:#cbd5e1}.muted{color:#6b7280}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:11px;background:#fff;font:inherit;margin:5px 0 10px}textarea{min-height:82px;resize:vertical}button{border:0;border-radius:11px;padding:11px 14px;background:#111827;color:#fff;font:inherit;cursor:pointer}.secondary{background:#e5e7eb;color:#111827}.danger{color:#b91c1c}.warn{color:#b45309}.ok{color:#047857}.badge{display:inline-block;border-radius:999px;background:#eef2ff;padding:4px 8px;font-size:12px}.progress{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:8px 0}.progress>i{display:block;height:100%;background:#111827}.maint{border-top:1px solid #eee;padding:13px 12px;background:var(--user);border:1px solid var(--user-border);border-radius:14px;margin:8px 0}.maint:first-child{border-top:0}.actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.small{font-size:13px;padding:8px 10px}.attention{border-left:5px solid #f59e0b;padding:9px 0 9px 11px}.attention.over{border-left-color:#dc2626}.kpi{font-size:22px;font-weight:700}.meter{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:#111827}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:62px;border:1px solid #e5e7eb;border-radius:10px;padding:5px;font-size:12px}.day b{display:block;font-size:13px}.event{background:#eef2ff;border-radius:7px;padding:3px;margin-top:3px}.empty{padding:12px 0;color:#6b7280}.pill{display:inline-block;background:#f3f4f6;border-radius:999px;padding:4px 8px;font-size:12px}.expense-chart-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.expense-chart{width:150px;height:150px;border-radius:50%;display:grid;place-items:center}.expense-chart>div{width:92px;height:92px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}.expense-legend{min-width:210px;flex:1}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}.part-unit{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:12px;border:1px solid #e5e7eb;border-radius:13px;margin:8px 0;background:#f8fafc}.part-unit img{width:90px;height:90px;object-fit:contain;border-radius:9px;background:#fff}.station{padding:13px;border-top:1px solid #eee;background:#f8fafc;border-radius:13px;margin:7px 0}.station:first-child{border-top:0}#map{height:320px;border-radius:15px;margin-top:10px;overflow:hidden}.status-ok{border-left:5px solid #16a34a}.status-soon{border-left:5px solid #eab308}.status-due{border-left:5px solid #dc2626}.user-card{background:var(--user);border:1px solid var(--user-border)}.chip{display:inline-flex;align-items:center;justify-content:center;border:1px solid #dbe3ee;background:#fff;color:#172033;border-radius:999px;padding:7px 10px;margin:3px;cursor:pointer}.section-note{background:#f8fafc;border-left:4px solid #94a3b8;padding:10px 12px;border-radius:10px}.muted2{color:#64748b;font-size:13px}.mileage-attention{box-shadow:0 0 0 2px #f59e0b55}.part-chip{min-width:0}.part-result{padding:12px;border:1px solid #dbe3ee;border-radius:13px;margin:8px 0;background:#f8fafc}.price-note{font-weight:600}.community-create{margin-top:8px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#f3f4f6;font-size:12px}.empty{padding:15px;text-align:center;color:#6b7280}.sheet-backdrop{position:fixed;inset:0;background:#0008;z-index:20;display:none;align-items:flex-end}.sheet-backdrop.show{display:flex}.sheet{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;padding:18px}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.x{background:#e5e7eb;color:#111827;border-radius:50%;width:38px;height:38px;padding:0}.check{display:flex;gap:8px;align-items:center;margin:5px 0 12px}.check input{width:auto;margin:0}.info-btn{display:inline-grid;place-items:center;width:20px;height:20px;padding:0;border-radius:50%;background:#e5e7eb;color:#374151;font-size:12px;font-weight:700}.info-pop{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:9px 11px;margin:7px 0;color:#475569;font-size:13px}.collapsed-extra{display:none}.theme-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.theme-btn{background:#fff;color:#111827;border:1px solid #d1d5db}.theme-btn.active{background:#111827;color:#fff}.preset-group{border:1px solid #e5e7eb;border-radius:13px;margin:8px 0;padding:0 11px;background:#fafafa}.preset-group summary{cursor:pointer;list-style:none;padding:12px 2px;display:flex;justify-content:space-between;align-items:center}.preset-group summary::-webkit-details-marker{display:none}.preset-group summary:after{content:"⌄";font-size:16px}.preset-group[open] summary:after{content:"⌃"}.preset-group>div{padding:2px 0 8px}.info-wrap{display:inline-block;vertical-align:middle}.info-pop{display:block}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;background:#111827;color:#fff;padding:12px 16px;border-radius:12px;display:none;max-width:90%}.toast.show{display:block}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding-left:8px;padding-right:8px}.theme-row{grid-template-columns:1fr}}
:root[data-theme="dark"]{color-scheme:dark;color:#e5e7eb;background:#0b1220;--user:#172235;--user-border:#3b4d67;--ok:#4ade80;--warn:#fbbf24;--danger:#f87171}
:root[data-theme="dark"] body{background:#0b1220;color:#e5e7eb}:root[data-theme="dark"] .nav{background:#0b1220;border-bottom:1px solid #253247}:root[data-theme="dark"] .nav button{background:#172235;color:#dbe4f0;border:1px solid #2d3c52}:root[data-theme="dark"] .nav button.active{background:#dbe4f0;color:#0b1220;border-color:#dbe4f0}:root[data-theme="dark"] button{background:#dbe4f0;color:#0b1220}:root[data-theme="dark"] .secondary{background:#26354a;color:#e5e7eb;border:1px solid #3a4a61}:root[data-theme="dark"] .card,:root[data-theme="dark"] .sheet{background:#141e2d;border:1px solid #2b3a50;box-shadow:0 5px 20px #0007}:root[data-theme="dark"] .hero{background:#1b2738;border:1px solid #3a4b63}:root[data-theme="dark"] .hero .muted{color:#b8c5d6}:root[data-theme="dark"] .maint{background:#182538;border-color:#34475f}:root[data-theme="dark"] .user-card{background:#1a2940;border-color:#415570}:root[data-theme="dark"] input,:root[data-theme="dark"] select,:root[data-theme="dark"] textarea{background:#0e1725;color:#f1f5f9;border-color:#41536b}:root[data-theme="dark"] input::placeholder,:root[data-theme="dark"] textarea::placeholder{color:#8190a5}:root[data-theme="dark"] .section-note,:root[data-theme="dark"] .info-pop{background:#1c2a3d;border-color:#40536c;color:#d3ddea}:root[data-theme="dark"] .progress,:root[data-theme="dark"] .meter{background:#34445a}:root[data-theme="dark"] .pill{background:#26364c;border:1px solid #3b4d65;color:#e5edf7}:root[data-theme="dark"] .station{background:#182638;border-color:#34485f}:root[data-theme="dark"] .part-unit{background:#182638;border-color:#34485f}:root[data-theme="dark"] .part-unit img{background:#0e1725}:root[data-theme="dark"] .event{background:#26364c;border:1px solid #3b4d65;color:#e5edf7}:root[data-theme="dark"] .day{background:#111b29;border-color:#34465e;color:#e5e7eb}:root[data-theme="dark"] .chip{background:#182638;border-color:#3a4d66;color:#e5e7eb}:root[data-theme="dark"] .info-btn{background:#26364c;color:#e5e7eb;border:1px solid #4a5d76}:root[data-theme="dark"] .empty{color:#9aa9bc}:root[data-theme="dark"] h1,:root[data-theme="dark"] h2,:root[data-theme="dark"] h3{color:#f3f6fa}:root[data-theme="dark"] .preset-group{background:#111c2a;border-color:#354960}:root[data-theme="dark"] .preset-group summary{color:#edf2f7}:root[data-theme="dark"] hr{border-color:#33465d}
</style></head>
<body>
<!-- v2.4 completion flow: Пробег соответствует данным приложения -->
<!-- Больше информации · Использовалось сохранённое масло · Артикул --><div class="wrap"><div class="nav" id="nav"></div><main id="app">Загрузка…</main><div class="muted" style="text-align:center;font-size:11px;margin:18px 0">АвтоПлан 2.7.0 — ТО и ремонт</div></div><div id="sheet" class="sheet-backdrop" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="sheet-head"><b id="sheetTitle">Форма</b><button class="x" onclick="closeSheet()">×</button></div><div id="sheetBody"></div></div></div><div id="toast" class="toast"></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const state={cars:[],maintenance:[],services:[],fines:[],drivers:[],favoriteStations:[],recentStations:[],user:null,attention:[],recommendations:{},mileageAnalysis:{}};let active='garage',stationResults=[],mapsKey='',partsContext=null,partsWizard={catalog:'',ssd:''};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);const val=id=>$(id)?.value??'';const money=n=>Number(n||0).toLocaleString('ru-RU')+' ₽';
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>$('toast').classList.remove('show'),2400)}
function openSheet(title,html){$('sheetTitle').textContent=title;$('sheetBody').innerHTML=html;$('sheet').classList.add('show')}function closeSheet(){$('sheet').classList.remove('show')}
async function api(path,opt={}){opt.headers={'content-type':'application/json',...(opt.headers||{})};if(tg?.initData)opt.headers['x-telegram-init-data']=tg.initData;else opt.headers['x-demo-user']='demo-user';const r=await fetch(path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ошибка запроса');return d}
async function load(){applyTheme();const s=await api('/api/state');Object.assign(state,s);state.recommendations={};for(const c of state.cars){try{state.recommendations[c.id]=(await api('/api/vehicles/recommendations?carId='+encodeURIComponent(c.id))).recommendations||[]}catch{} try{state.mileageAnalysis[c.id]=await api('/api/mileage-analysis?carId='+encodeURIComponent(c.id))}catch{}}try{state.attention=(await api('/api/dashboard')).attention||[]}catch{}try{state.recentStations=(await api('/api/stations/recent')).stations||[]}catch{}try{mapsKey=(await api('/api/app-meta')).mapsApiKey||''}catch{}render();maybeAskMileage()}
function carLabel(c){return esc(c.name||`${c.make||''} ${c.model||''}`.trim()||'Автомобиль')}
function formatDateRU(value){if(!value)return '—';const m=String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return String(value);return new Date(Number(m[1]),Number(m[2])-1,Number(m[3])).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}).replace(' г.',' года')}
function formatMonthRU(value){const m=String(value||'').match(/^(\d{4})-(\d{2})$/);return m?new Date(Number(m[1]),Number(m[2])-1,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'}):String(value||'—')}
function infoToggle(id,text){return `<span class="info-wrap"><button type="button" class="info-btn" title="Подробнее" onclick="event.stopPropagation();toggleInfo('${id}')">i</button><span id="${id}" class="info-pop" style="display:none">${esc(text)}</span></span>`}
function toggleInfo(id){const e=$(id);if(e)e.style.display=e.style.display==='none'?'block':'none'}
function setTheme(theme){const t=['light','dark','system'].includes(theme)?theme:'system';localStorage.setItem('autoplan-theme',t);const actual=t==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;document.documentElement.dataset.theme=actual;render()}
function applyTheme(){const t=localStorage.getItem('autoplan-theme')||'system';document.documentElement.dataset.theme=t==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t}

function statusFor(m,c){const km=m.intervalKm!=null?m.intervalKm-(c.odometer-m.lastDoneOdometer):null;const days=m.nextDate?Math.ceil((new Date(`${m.nextDate}T23:59:59`)-new Date())/86400000):null;const due=(km!=null&&km<=0)||(days!=null&&days<=0);const soon=!due&&((km!=null&&km<=Number(m.reminderKm??1000))||(days!=null&&days<=Number(m.reminderDays??30)));return{km,days,due,soon}}
function nav(){const items=[['garage','🚗 Авто'],['maintenance','🔧 ТО и ремонт'],['calendar','📅 Календарь'],['history','📋 История'],['fines','⚠️ Штрафы'],['stations','🛠 СТО'],['parts','🔩 Запчасти'],['communities','👥 Сообщества'],['settings','⚙️']];$('nav').innerHTML=items.map(([k,t])=>`<button class="${active===k?'active':''}" onclick="show('${k}')">${t}</button>`).join('')}
function expenseChart(){const names={maintenance:'ТО и расходники',repair:'Ремонт',fuel:'Топливо',tires:'Шины',wash:'Мойка',other:'Другое'};const vals={};state.services.forEach(s=>{const k=s.category||'maintenance';vals[k]=(vals[k]||0)+Number(s.cost||0)});const rows=Object.entries(vals).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);const total=rows.reduce((n,[,v])=>n+v,0);if(!total)return '<div class="empty">Пока нет расходов для диаграммы.</div>';let cur=0;const palette=['#1f2937','#2563eb','#f59e0b','#16a34a','#8b5cf6','#94a3b8'];const parts=rows.map(([k,v],i)=>{const start=cur;cur+=v/total*360;return `${palette[i%palette.length]} ${start}deg ${cur}deg`}).join(',');return `<div class="expense-chart-wrap"><div class="expense-chart" style="background:conic-gradient(${parts})"><div>${money(total)}</div></div><div class="expense-legend">${rows.map(([k,v],i)=>`<div class="row"><span><i class="dot" style="background:${palette[i%palette.length]}"></i>${names[k]||k}</span><b>${money(v)}</b></div>`).join('')}</div></div>`}function recommendationCards(){return state.cars.map(c=>{const rs=state.recommendations[c.id]||[];return rs.length?`<section class="card"><div class="row"><h2>🧠 Профилактика</h2><span class="pill">${esc(c.make)} ${esc(c.model)} ${c.year||''}</span></div><p class="muted">Рекомендации сформированы по марке, модели, году и текущему пробегу. Это не прогноз поломки.</p>${rs.map(r=>`<div class="maint"><b>🟡 ${esc(r.title)}</b><span class="muted"> · ориентир ${Number(r.mileage).toLocaleString('ru-RU')} км</span><p>${esc(r.description)}</p><button class="small secondary" onclick='showRecommendationInfo(${JSON.stringify(r).replace(/'/g,'&#39;')})'>ⓘ Почему?</button></div>`).join('')}</section>`:''}).join('')}
function showRecommendationInfo(r){openSheet('ⓘ О рекомендации',`<b>${esc(r.title)}</b><p>${esc(r.description)}</p><p class="muted2">Это профилактическая рекомендация, а не утверждение о неисправности. Точный регламент зависит от VIN, двигателя и условий эксплуатации.</p>`)}
function settings(){const r=state.user?.reminder||{};const theme=localStorage.getItem('autoplan-theme')||'system';return `<h1>⚙️ Настройки</h1><section class="card"><h2>🎨 Тема приложения</h2><p class="muted">Выберите светлую, тёмную или системную тему.</p><div class="theme-row"><button class="theme-btn ${theme==='light'?'active':''}" onclick="setTheme('light')">☀️ Светлая</button><button class="theme-btn ${theme==='dark'?'active':''}" onclick="setTheme('dark')">🌙 Тёмная</button><button class="theme-btn ${theme==='system'?'active':''}" onclick="setTheme('system')">📱 Системная</button></div></section><section class="card"><h2>🔔 Напоминания</h2><label class="check"><input id="enabled" type="checkbox" ${r.enabled!==false?'checked':''}> Включить напоминания</label><div class="grid"><label>Частота<select id="mode"><option value="weekly">Раз в неделю</option><option value="biweekly">Раз в две недели</option><option value="monthly">Раз в месяц</option></select></label><label>Время<input id="time" type="time" value="${esc(r.time||'19:00')}"></label></div><div class="grid"><label>День недели<select id="weekday"><option value="0">Понедельник</option><option value="1">Вторник</option><option value="2">Среда</option><option value="3">Четверг</option><option value="4">Пятница</option><option value="5">Суббота</option><option value="6">Воскресенье</option></select></label><label>День месяца<input id="monthlyDay" type="number" min="1" max="31" value="${Number(r.monthlyDay||1)}"></label></div><button onclick="saveSettings()">Сохранить настройки</button></section><section class="card"><h2>💾 Данные</h2><p class="muted">Резервная копия содержит автомобили, ТО, историю пробега, расходы и связанные данные.</p><div class="actions"><button class="secondary" onclick="exportData()">Выгрузить резервную копию</button><button class="secondary" onclick="document.getElementById('backupFile').click()">Восстановить из копии</button></div><input id="backupFile" type="file" accept="application/json" style="display:none" onchange="importBackup(this)"></section><section class="card"><h2>ℹ️ АвтоПлан</h2><p class="muted">Версия 2.6.1 · ТО, ремонт и каталог запчастей</p></section>`}
function loadSettingsUI(){const r=state.user?.reminder||{};if($('mode'))$('mode').value=r.mode||'weekly';if($('weekday'))$('weekday').value=String(r.weekday??0)}
function render(){nav();$('app').innerHTML=active==='garage'?garage():active==='maintenance'?maintenance():active==='calendar'?calendar():active==='history'?history():active==='fines'?fines():active==='stations'?stations():active==='parts'?parts():active==='communities'?communities():settings();if(active==='stations'){setTimeout(initMap,30);setTimeout(loadBookings,50)}if(active==='settings')loadSettingsUI();if(active==='parts')loadPartsUI()}
function show(k){active=k;render();if(k==='calendar'&&!window.calendarEvents)loadCalendar()}
function dashboard(){const a=state.attention||[];const total=state.services.reduce((n,s)=>n+Number(s.cost||0),0);const due=a.filter(x=>x.due).length;const soon=a.filter(x=>x.soon).length;const score=Math.max(0,Math.min(100,100-due*25-soon*8));const scoreText=score>=80?'Всё под контролем':score>=55?'Есть задачи на подходе':'Нужно заняться автомобилем';return `<section class="hero"><h1>Ваш автомобиль под контролем</h1><div class="hero muted">АвтоПлан следит за ТО, расходниками, сроками и расходами. СТО — только когда действительно нужна помощь.</div><p><b>${score>=80?'🟢':score>=55?'🟡':'🔴'} ${scoreText}</b></p></section>${state.cars.length?state.cars.map(c=>{const a=state.mileageAnalysis[c.id]||{};return `<section class="card user-card"><div class="row"><div><h2>📏 ${carLabel(c)}</h2><div class="muted">Данные пробега на сегодняшний день</div></div><button class="small" onclick="openKmForm('${c.id}')">Указать пробег</button></div><p class="kpi">${Number(c.odometer).toLocaleString('ru-RU')} км</p>${a.kmPerMonth?`<div class="section-note">📈 Средний пробег: около <b>${Math.round(a.kmPerMonth).toLocaleString('ru-RU')} км/месяц</b>${a.next10k?.projectedDate?`<br><span class="muted2">Ориентировочно +10 000 км: ${formatDateRU(a.next10k.projectedDate)}</span>`:''}</div>`:'<div class="muted2">После нескольких записей пробега приложение начнёт считать средний темп.</div>'}</section>`}).join(''):''}${a.length?`<section class="card"><div class="row"><h2>🔔 Что сделать следующим</h2><span class="pill">${due+soon} задач</span></div>${a.slice(0,6).map(x=>`<div class="attention ${x.due?'over':''}"><b>${esc(x.name)}</b> · ${esc(x.carName)}<br>${x.due?'<span class="danger"><b>Пора выполнить</b></span>':`<span class="warn">Скоро: ${x.kmRemaining!=null?Number(x.kmRemaining).toLocaleString('ru-RU')+' км':''}${x.daysRemaining!=null?' · '+x.daysRemaining+' дн.':''}</span>`}</div>`).join('')}<button class="secondary small" onclick="show('maintenance')">Открыть всё ТО</button></section>`:`<section class="card"><h2>🟢 Ближайших задач нет</h2><p class="muted">Добавьте интервалы для масла, фильтров, тормозов и других расходников — приложение начнёт считать ресурс.</p><button onclick="show('maintenance')">Настроить ТО</button></section>`}<section class="grid"><div class="card"><div class="muted">Автомобилей</div><div class="kpi">${state.cars.length}</div></div><div class="card"><div class="muted">Расходы</div><div class="kpi">${money(total)}</div></div></section><section class="card"><div class="row"><h2>💰 Расходы по категориям</h2><button class="small secondary" onclick="show('history')">Подробнее</button></div>${expenseChart()}</section>${recommendationCards()}${state.cars.map(c=>`<section class="card"><div class="row"><div><h2>${carLabel(c)}</h2><span class="muted">${Number(c.odometer).toLocaleString('ru-RU')} км</span></div><button class="small" onclick="openCarForm('${c.id}')">✏️</button></div><div class="muted">Общее ТО: ${c.due.due?'пора':Number(c.due.kmRemaining).toLocaleString('ru-RU')+' км'}${c.due.dateRemaining!=null?' · '+c.due.dateRemaining+' дн.':''}</div><div class="actions"><button class="small" onclick="openKmForm('${c.id}')">📏 Обновить пробег</button><button class="small secondary" onclick="openServiceForm('${c.id}')">🔧 Записать работу/расход</button></div></section>`).join('')||'<section class="card empty"><h2>🚗 Начнём с автомобиля</h2><p>Добавьте автомобиль, затем настроим его ТО и интервалы.</p><button onclick="openCarForm()">Добавить автомобиль</button></section>'}`}
function mileageStale(c){const h=(state.mileageHistory||[]).filter(x=>x.carId===c.id).sort((a,b)=>String(b.recordedAt).localeCompare(String(a.recordedAt)));if(!h.length)return true;return String(h[0].recordedAt).slice(0,10)!==today()}
function maybeAskMileage(){if(!state.cars?.length)return;const key='autoplan-mileage-prompt-'+today();if(sessionStorage.getItem(key))return;const c=state.cars.find(x=>mileageStale(x));if(!c)return;sessionStorage.setItem(key,'1');setTimeout(()=>openSheet('📏 Обновите текущий пробег',`<p class="muted">Чтобы расчёт ТО и рекомендаций был точнее, укажите пробег автомобиля <b>${carLabel(c)}</b>.</p><button onclick="openKmForm('${c.id}')">Указать текущий пробег</button><button class="secondary" onclick="closeSheet()">Не сейчас</button>`),450)}
function garage(){return `${dashboard()}<section class="card"><div class="row"><h2>Мои автомобили</h2><button class="small" onclick="openCarForm()">➕ Добавить</button></div>${state.cars.length?state.cars.map(c=>{const d=c.due;return `<div class="maint user-card"><div class="row"><b>${carLabel(c)}</b><span>${d.due?'🔴':'🟢'}</span></div><div class="muted">${esc(c.make)} ${esc(c.model)} ${c.year||''}${c.plate?' · '+esc(c.plate):''}</div><div class="kpi">${Number(c.odometer).toLocaleString('ru-RU')} км</div><div class="${d.due?'danger':'ok'}"><b>${d.due?'Общее ТО пора делать':'До общего ТО '+Number(d.kmRemaining).toLocaleString('ru-RU')+' км'}</b>${d.dateRemaining!=null?' · '+(d.dateRemaining<=0?'срок наступил':d.dateRemaining+' дн.'):''}</div><div class="actions"><button class="small mileage-btn ${mileageStale(c)?'mileage-attention':''}" onclick="openKmForm('${c.id}')">📏 Текущий пробег</button><button class="small secondary" onclick="openServiceForm('${c.id}')">🔧 Записать работу/расход</button><button class="small secondary" onclick="openCarForm('${c.id}')">✏️ Изменить</button></div></div>`}).join(''):'<div class="empty">Добавьте первый автомобиль — дальше приложение само покажет, что и когда менять.</div>'}</section>`}
const PRESET_GROUPS={engine:'Двигатель',filters:'Фильтры',fluids:'Жидкости',brakes:'Тормозная система',transmission:'Коробка передач',axles:'Мосты и раздатка',suspension_front:'Ходовая — передняя',suspension_rear:'Ходовая — задняя',suspension:'Ходовая — общее',steering:'Рулевое управление',electrical:'Электрика',wheels:'Колёса и шины',body_other:'Прочее обслуживание',exhaust:'Выхлопная система',safety:'Безопасность и электроника'};
function groupedPresets(p,cls='presetCheck'){const selectedGeneral=window._selectedGeneral||new Set();const groups={};p.forEach(x=>(groups[x.group||'other']??=[]).push(x));return Object.entries(groups).map(([g,items])=>`<details class="preset-group"><summary><b>${esc(PRESET_GROUPS[g]||'Прочее')}</b><span class="muted2">${items.length}</span></summary><div>${items.map(x=>`<label class="check"><input type="checkbox" class="${cls}" value="${x.key}" data-name="${esc(x.name)}" ${cls==='generalCheck'&&(window._selectedGeneral?.has(x.key)||window._selectedGeneral?.has(x.name))?'checked':''}> ${esc(x.name)}</label>`).join('')}</div></details>`).join('')}
function maintenance(){return `<h1>🔧 ТО и ремонт</h1><section class="card"><b>Обслуживание автомобиля по узлам и системам.</b><p class="muted">Откройте нужный раздел вместо длинного списка. Масла, фильтры, тормоза, КПП, мосты, ходовая, рулевое управление и электрика ведутся отдельно.</p></section>${state.cars.map(c=>{const ms=state.maintenance.filter(m=>m.carId===c.id);const groups={};ms.forEach(x=>(groups[x.group||groupForPreset(x.presetKey)]??=[]).push(x));return `<section class="card"><div class="row"><h2>${carLabel(c)}</h2><button class="small" onclick="openMaintForm('${c.id}')">➕ Добавить</button></div>${Object.entries(groups).map(([g,items])=>`<details class="preset-group"><summary><b>${esc(PRESET_GROUPS[g]||g)}</b><span class="pill">${items.length}</span></summary>${items.map(m=>maintCard(m,c)).join('')}</details>`).join('')||'<div class="empty">Пока нет настроенных пунктов.</div>'}</section>`}).join('')||'<section class="card empty">Сначала добавьте автомобиль.</section>'}`}
const PRESET_KEY_GROUPS={oil:'engine',oil_filter:'engine',air_filter:'engine',fuel_filter:'engine',spark_plugs:'engine',engine_coolant:'fluids',brake_fluid:'brakes',power_steering_fluid:'fluids',ac_service:'fluids',atf:'transmission',atf_filter:'transmission',mtf:'transmission',dct_oil:'transmission',transfer_oil:'axles',front_diff_oil:'axles',rear_diff_oil:'axles',cabin_filter:'filters',pads_front:'brakes',pads_rear:'brakes',discs_front:'brakes',discs_rear:'brakes',brake_hoses:'brakes',timing_belt:'engine',timing_chain:'engine',accessory_belt:'engine',battery:'electrical',alternator:'electrical',starter:'electrical',cooling_system:'engine',thermostat:'engine',injectors:'engine',throttle:'engine',pcv:'engine',engine_mounts:'engine',shock_front:'suspension_front',shock_rear:'suspension_rear',ball_joint:'suspension_front',tie_rods:'steering',control_arm_front:'suspension_front',bushings_front:'suspension_front',bushings_rear:'suspension_rear',wheel_bearings:'suspension',cv_joints:'suspension',steering_fluid:'steering',clutch:'transmission',driveshaft:'axles',tires:'wheels',alignment:'wheels',headlights:'electrical',wipers:'body_other',exhaust:'exhaust',catalyst:'exhaust',oxygen_sensor:'engine',egr:'engine',abs_esp:'safety',airbags:'safety',ac_filter:'fluids',suspension_repair:'suspension',control_arm:'suspension',bushings:'suspension',engine_repair:'engine',electrical_repair:'electrical'};function groupForPreset(key){return (window.presets||[]).find(x=>x.key===key)?.group||PRESET_KEY_GROUPS[key]||'other'}
function maintCard(m,c){const s=statusFor(m,c);const used=m.intervalKm?Math.min(100,Math.max(0,100-((Math.max(0,s.km))/m.intervalKm*100))):0;const status=s.due?'🔴 Пора':s.soon?'🟡 Скоро':'🟢 В норме';return `<div class="maint"><div class="row"><b>${esc(m.name)}</b><span>${status}</span></div><div class="muted">Последняя замена: ${esc(formatDateRU(m.lastDoneDate))} · ${Number(m.lastDoneOdometer).toLocaleString('ru-RU')} км${m.lastCost?' · '+money(m.lastCost):''}</div>${m.intervalKm?`<div class="progress"><i style="width:${used}%"></i></div><span class="pill">${s.due?'Просрочено':Number(Math.max(0,s.km)).toLocaleString('ru-RU')+' км до замены'}</span>`:''}${m.nextDate?` <span class="pill">${s.days<=0?'Срок наступил':s.days+' дн.'}</span>`:''}<div class="actions"><button class="small" onclick="openCompleteForm('${m.id}')">✅ Выполнено</button><button class="small secondary" onclick="openMaintForm('${m.carId}','${m.id}')">⚙️ Настроить</button><button class="small secondary" onclick="removeMaintenance('${m.id}')">🗑</button></div></div>`}
function calendar(){const now=new Date();const y=now.getFullYear(),m=now.getMonth();const first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7;const events=(window.calendarEvents||[]);const cells=[];for(let i=0;i<offset;i++)cells.push('<div class="day"></div>');for(let d=1;d<=days;d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const es=events.filter(e=>e.date===ds);cells.push(`<div class="day"><b>${d}</b>${es.map(e=>`<div class="event">${esc(e.name)}</div>`).join('')}</div>`)}return `<h1>📅 Календарь ТО</h1><section class="card"><div class="row"><div><b>${now.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</b><div class="muted">Сроки обслуживания по датам</div></div><button class="small" onclick="loadCalendar()">↻ Обновить</button></div></section><section class="card"><div class="calendar-grid">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="muted"><b>${x}</b></div>`).join('')}${cells.join('')}</div></section><section class="card"><h3>Ближайшие события</h3>${events.filter(e=>e.date>=today()).slice(0,10).map(e=>`<div class="maint"><b>${esc(e.name)}</b> · ${esc(formatDateRU(e.date))}<br><span class="muted">${esc(e.carName)}${e.kmRemaining!=null?' · '+Number(e.kmRemaining).toLocaleString('ru-RU')+' км остаётся':''}</span></div>`).join('')||'<div class="empty">Нет событий в ближайшие 90 дней.</div>'}</section>`}
async function loadCalendar(){try{const r=await api('/api/calendar');window.calendarEvents=r.events||[];render()}catch(e){toast('Календарь недоступен')}}
function history(){const total=state.services.reduce((a,s)=>a+Number(s.cost||0),0);const byMonth={};state.services.forEach(s=>{const k=String(s.date||'').slice(0,7);if(k)byMonth[k]=(byMonth[k]||0)+Number(s.cost||0)});const months=Object.entries(byMonth).sort((a,b)=>b[0].localeCompare(a[0]));const mileageBlocks=state.cars.map(c=>{const rows=(state.mileageHistory||[]).filter(x=>x.carId===c.id).slice(0,12);return `<section class="card"><div class="row"><div><h2>📏 История пробега</h2><p class="muted">${carLabel(c)}</p></div><button class="small" onclick="openKmForm('${c.id}')">Указать пробег</button></div>${rows.map(x=>`<div class="maint"><div class="row"><b>${Number(x.odometer).toLocaleString('ru-RU')} км</b><span class="muted2">${esc(new Date(x.recordedAt).toLocaleString('ru-RU',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}))}</span></div></div>`).join('')||'<div class="empty">Пока нет записей пробега.</div>'}</section>`}).join('');return `<h1>📋 История и расходы</h1>${mileageBlocks}<section class="card"><div class="row"><div><h2>📄 Отчёт по автомобилю</h2><p class="muted">Даты, пробег, выполненные работы и все расходы по машине.</p></div><button onclick="printCarReport()">Выгрузить PDF</button></div><div class="grid"><label>Автомобиль<select id="reportCar">${state.cars.map(c=>`<option value="${c.id}">${carLabel(c)}</option>`).join('')}</select></label><div style="display:flex;align-items:end"><button class="secondary" style="width:100%" onclick="openExpenseForm()">➕ Добавить расход</button></div></div></section><section class="grid"><div class="card"><div class="muted">Всего записано</div><div class="kpi">${state.services.length}</div></div><div class="card"><div class="muted">Всего расходов</div><div class="kpi">${money(total)}</div></div></section><section class="card"><div class="row"><h2>💰 По месяцам</h2><button class="small secondary" onclick="loadAnalytics()">Аналитика</button></div>${months.length?months.slice(0,12).map(([m,v])=>`<div class="maint"><div class="row"><span>${esc(formatMonthRU(m))}</span><b>${money(v)}</b></div></div>`).join(''):'<div class="empty">Пока нет расходов.</div>'}</section>${window.analyticsData?.byItem?.length?`<section class="card"><h2>📊 По категориям</h2>${window.analyticsData.byItem.slice(0,8).map(x=>`<div class="row maint"><span>${esc(x.name)}</span><b>${money(x.cost)}</b></div>`).join('')}</section>`:''}${state.services.length?state.services.map(s=>`<section class="card"><div class="row"><b>${esc(formatDateRU(s.date))}</b><span>${Number(s.odometer).toLocaleString('ru-RU')} км</span></div><p>${esc(s.items.join(', ')||'ТО')}</p><b>${money(s.cost)}</b>${s.note?`<p class="muted">${esc(s.note)}</p>`:''}<div class="actions"><button class="small secondary" onclick="openServiceEdit('${s.id}')">✏️ Изменить</button><button class="small secondary" onclick="removeService('${s.id}')">🗑 Удалить</button></div></section>`).join(''):'<section class="card empty">История ТО пока пустая.</section>'}`}
async function loadAnalytics(){try{window.analyticsData=await api('/api/analytics');render()}catch(e){toast('Аналитика недоступна')}}

function fines(){return `<h1>⚠️ Штрафы</h1><section class="card"><b>Автоматическая проверка штрафов</b><p class="muted">Штрафы не вводятся вручную. АвтоПлан использует данные по автомобилям (СТС/номер) и водительским правам, если подключён официальный или лицензированный провайдер.</p><div class="actions"><button onclick="checkFines()">🔎 Проверить штрафы</button><button class="secondary" onclick="openOfficialFines()">Госуслуги</button></div></section><section class="card"><div class="row"><h2>🚗 Автомобили</h2><span class="pill">по СТС</span></div>${state.cars.map(c=>`<div class="maint user-card"><b>${carLabel(c)}</b><div class="muted">Госномер: ${esc(c.plate||'не указан')} · СТС: ${esc(c.stsNumber||'не указан')}</div></div>`).join('')||'<div class="empty">Нет автомобилей.</div>'}</section><section class="card"><div class="row"><h2>🚘 Водительские права</h2><button class="small" onclick="openDriverForm()">➕ Добавить</button></div><p class="muted">Права нужны для проверки штрафов, которые относятся к водителю.</p>${state.drivers.map(d=>`<div class="maint user-card"><div class="row"><b>${esc(d.name||'Водитель')}</b><button class="small secondary" onclick="removeDriver('${d.id}')">Удалить</button></div><div class="muted">В/у: ${esc(d.licenseNumber)}${d.licenseIssueDate?' · от '+esc(d.licenseIssueDate):''}</div></div>`).join('')||'<div class="empty">Права ещё не добавлены.</div>'}</section><section class="card"><h2>📄 Найденные штрафы</h2>${state.fines.length?state.fines.map(f=>`<div class="maint user-card"><div class="row"><b>${money(f.amount)}</b><span class="${f.status==='paid'?'ok':'danger'}">${f.status==='paid'?'Оплачен':'Не оплачен'}</span></div><div>${esc(formatDateRU(f.date))}${f.dueDate?' · срок '+esc(f.dueDate):''}</div><div class="muted">${esc(f.article||'Штраф ГИБДД')} · ${esc(f.description||'')}</div></div>`).join(''):'<div class="empty">Новых штрафов нет или проверка ещё не выполнялась.</div>'}</section>`}

function stationCard(s){viewStation(s);return `<div class="station"><div class="row"><b>${esc(s.name)}</b>${s.rating?`<span>⭐ ${s.rating}</span>`:''}</div><div class="muted">${esc(s.address)}${s.distance!=null?' · '+s.distance.toFixed(1)+' км':''}</div>${s.phone?`<div>${esc(s.phone)}</div>`:''}<div class="actions"><button class="small" onclick='bookStation(${JSON.stringify(s).replace(/'/g,"&#39;")})'>📅 Заявка</button><button class="small secondary" onclick='favoriteStation(${JSON.stringify(s).replace(/'/g,"&#39;")})'>⭐ Сохранить</button></div></div>`}
function stations(){const cats=['автосервис','шиномонтаж','автомойка','автоэлектрик','замена масла','ремонт кондиционеров','кузовной ремонт','ремонт двигателя'];return `<h1>🛠 СТО и автосервисы</h1><section class="card"><p class="muted">Ищите нужную автомобильную услугу рядом с собой. Поиск организаций и карта работают через Яндекс.</p><div>${cats.map(c=>`<button class="chip" onclick="quickStation('${c}')">${c}</button>`).join('')}</div><div class="grid"><input id="stationQ" placeholder="СТО, шиномонтаж, электрик…"><button onclick="findStations()">📍 Найти рядом</button></div><div id="map"></div><div id="mapNote" class="muted2"></div></section><section class="card"><h3>Результаты</h3>${stationResults.map(stationCard).join('')||'<div class="empty">Разрешите геолокацию и запустите поиск.</div>'}</section><section class="card"><h3>⭐ Мои СТО</h3>${state.favoriteStations.map(s=>`<div class="station"><b>${esc(s.name)}</b><br><span class="muted">${esc(s.address)}</span>${s.phone?`<br><a href="tel:${esc(s.phone)}">☎️ ${esc(s.phone)}</a>`:''}</div>`).join('')||'<div class="empty">Пока пусто.</div>'}<h3>📅 Мои заявки</h3><div id="bookings">Загрузка…</div></section><section class="card"><h3>🕘 Недавно просмотренные</h3>${state.recentStations.map(s=>`<div class="station"><div class="row"><b>${esc(s.name)}</b><button class="small secondary" onclick="searchStations('${esc(s.name)}',${Number(s.lat)},${Number(s.lon)})">Открыть</button></div><span class="muted">${esc(s.address)}</span></div>`).join('')||'<div class="empty">Здесь появятся СТО, которые вы открывали.</div>'}</section>`}

let partsVehicle=null,partsUnits=[],partsCategories=[],partsLastResults=[];
function parts(){const cars=state.cars||[];return `<h1>🔩 Запчасти</h1><section class="card"><h2>Подбор именно для вашего автомобиля</h2><p class="muted">АвтоПлан сначала определяет конкретную модификацию по марке, модели, году и двигателю. После этого поиск запчасти идёт только внутри применимости этой модификации.</p>${cars.length?`<label>Автомобиль<select id="partsCar">${cars.map(c=>`<option value="${c.id}">${carLabel(c)}${c.vin?' · VIN':''}</option>`).join('')}</select></label><div class="actions"><button onclick="partsBySelectedCar()">🔎 Подобрать для авто</button><button class="secondary" onclick="partsVinForm()">VIN</button></div>`:'<div class="empty">Сначала добавьте автомобиль.</div>'}</section><section class="card"><h2>🔍 Поиск детали</h2><p class="muted">Можно писать по-разному: «ступичный подшипник», «подшипник ступицы», «подшипник переднего колеса». АвтоПлан нормализует названия и ищет по связанным терминам.</p><div class="grid"><input id="partsQ" placeholder="Например: подшипник ступицы"><button onclick="partsSearch()">Найти</button></div><div class="actions">${['задний ступичный подшипник','подшипник ступицы','передний тормозной диск','масляный фильтр','стойка стабилизатора'].map(x=>`<button class="chip" onclick="partsQuickSearch('${x}')">${x}</button>`).join('')}</div><div id="partsResults"></div></section><section id="partsCatalog" class="card"><div class="empty">Сначала выберите автомобиль.</div></section>`}
function partsCar(){return state.cars.find(c=>c.id===val('partsCar'))||state.cars[0]}
async function partsBySelectedCar(silent=false){const c=partsCar();if(!c)return;try{const p=new URLSearchParams({make:c.make||'',model:c.model||'',year:c.year||'',engine:c.engine||c.engineCode||'',transmission:c.transmission||''});const r=await api('/api/parts/free/vehicle?'+p);if(!r.vehicle)throw Error('vehicle_not_found');partsVehicle=r.vehicle;closeSheet();renderPartsVehicle();if(!silent)toast('Модификация автомобиля определена');}catch(e){if(!silent)openPartsManual(c)}}
function openPartsManual(c=partsCar()){const x=c||{};openSheet('Ручной подбор автомобиля',`<p class="muted">Если бесплатный каталог не смог автоматически определить модификацию, выберите или укажите параметры автомобиля вручную.</p><div class="grid"><label>Марка<input id="partsMake" value="${esc(x.make||'')}" placeholder="Например: LADA"></label><label>Модель<input id="partsModel" value="${esc(x.model||'')}" placeholder="Например: Kalina"></label><label>Год<input id="partsYear" type="number" value="${esc(x.year||'')}" placeholder="Например: 2012"></label><label>Двигатель<input id="partsEngine" value="${esc(x.engine||x.engineCode||'')}" placeholder="Например: 1.6 / 11183"></label><label>КПП<input id="partsTransmission" value="${esc(x.transmission||'')}" placeholder="Например: МКПП"></label></div><button onclick="partsManualSearch()">🔎 Найти модификацию</button>`)}
async function partsManualSearch(){const p=new URLSearchParams({make:val('partsMake').trim(),model:val('partsModel').trim(),year:val('partsYear').trim(),engine:val('partsEngine').trim(),transmission:val('partsTransmission').trim()});if(!p.get('make')||!p.get('model'))return toast('Укажите марку и модель');try{const r=await api('/api/parts/free/vehicle?'+p);if(!r.vehicle)throw Error('vehicle_not_found');partsVehicle=r.vehicle;closeSheet();renderPartsVehicle();toast('Автомобиль определён по указанным параметрам')}catch(e){toast('Не удалось определить модификацию. Проверьте марку, модель и год.')}}
function partsVinForm(){openSheet('Поиск по VIN',`<p class="muted">Введите VIN. АвтоПлан сначала попробует определить автомобиль по VIN. Если бесплатный VIN-декодер недоступен, ниже можно продолжить ручным подбором без повторного ввода автомобиля.</p><input id="partsVin" value="${esc(partsCar()?.vin||'')}" placeholder="VIN / номер кузова"><div class="actions"><button onclick="partsVinSearch()">Продолжить по VIN</button><button class="secondary" onclick="openPartsManual(partsCar())">Выбрать автомобиль вручную</button></div>`)}
async function partsVinSearch(){const vin=val('partsVin').trim().toUpperCase();if(!vin)return toast('Введите VIN');try{const r=await api('/api/parts/free/vin?vin='+encodeURIComponent(vin));if(r.vehicle?.vehicleId){partsVehicle=r.vehicle;closeSheet();renderPartsVehicle();toast('Автомобиль определён по VIN');return}}catch(e){}const c=partsCar();if(c?.make&&c?.model){closeSheet();await partsBySelectedCar();return}openPartsManual({vin})}
async function renderPartsVehicle(){if(!partsVehicle)return;const v=partsVehicle;const host=$('partsCatalog');if(!host)return;const a=v.attributes||{};host.innerHTML=`<div class="row"><div><h2>🚗 ${esc(v.brand)} ${esc(v.name)}</h2><div class="muted">${esc([a.year,a.engine,a.engineCode,a.power,a.drive,a.body].filter(Boolean).join(' · '))}</div><div class="muted2">Конкретная модификация выбрана по данным каталога.</div></div><button class="small secondary" onclick="partsBySelectedCar()">Сменить</button></div><div class="section-note"><b>✓ Применимость включена</b><br><span class="muted2">Результаты ниже относятся к выбранной модификации. Аналоги показываются только после найденной детали.</span></div><div class="grid"><button onclick="loadPartsCategories()">📚 Узлы</button><button onclick="loadPartsUnits()">📐 Структура каталога</button></div><div id="partsUnits"></div>`;await loadPartsUnits()}
async function loadPartsCategories(){try{const r=await api('/api/parts/free/categories?vehicleId='+encodeURIComponent(partsVehicle.vehicleId));partsCategories=r.categories||[];openSheet('Узлы автомобиля',partsCategories.map(x=>`<button class="chip part-chip" onclick="loadPartsUnits('${x.categoryId}')">📁 ${esc(x.name||'Узел')}</button>`).join('')||'<div class="empty">Узлы не найдены.</div>')}catch(e){toast('Не удалось загрузить узлы')}}
async function loadPartsUnits(categoryId='-1'){if(!partsVehicle)return;try{const q=new URLSearchParams({vehicleId:partsVehicle.vehicleId,categoryId});const r=await api('/api/parts/free/units?'+q);partsUnits=r.units||[];closeSheet();const el=$('partsUnits');if(!el)return;el.innerHTML=`<h3>Узлы / группы деталей</h3>${partsUnits.slice(0,120).map(u=>`<div class="part-unit"><div style="display:grid;place-items:center;font-size:34px">🔧</div><div><b>${esc(u.name)}</b><div class="muted2">Узел каталога</div><button class="small" onclick='loadUnitDetails(${JSON.stringify(u).replace(/'/g,'&#39;')})'>Открыть детали</button></div></div>`).join('')||'<div class="empty">Группы не найдены.</div>'}`}catch(e){toast('Структура каталога недоступна')}}
async function loadUnitDetails(u){try{const q=new URLSearchParams({vehicleId:partsVehicle.vehicleId,unitId:u.unitId});const r=await api('/api/parts/free/unit-details?'+q);openSheet('Детали — '+(u.name||''),(r.details||[]).slice(0,50).map(d=>`<div class="maint"><div class="row"><b>${esc(d.name||'Запчасть')}</b><span class="pill">${esc(d.codeOnImage||'артикул не указан')}</span></div><div class="muted2">Подходит для выбранной модификации. ${d.brand?esc(d.brand):''}</div></div>`).join('')||'<div class="empty">Детали не найдены.</div>')}catch(e){toast('Не удалось загрузить детали')}}
function partsQuickSearch(q){$('partsQ').value=q;partsSearch()}
async function partsSearch(){
 if(!partsVehicle)return toast('Сначала выберите автомобиль');
 const q=val('partsQ').trim(); if(!q)return toast('Введите название детали');
 try{
  const p=new URLSearchParams({vehicleId:partsVehicle.vehicleId,q});
  const r=await api('/api/parts/free/search?'+p); partsLastResults=r.results||[];
  let html=`<h3>Найдено для «${esc(q)}»</h3>`;
  if(!partsLastResults.length){html+='<div class="empty">По этому названию ничего не найдено. Попробуйте другое название: например «подшипник ступицы» вместо «ступичный подшипник».</div>'}
  else{
   html+=partsLastResults.map(x=>{
    const btn=x.article?`<button class="small secondary" onclick="showPartAnalogs('${esc(x.article)}')">🔄 Аналоги</button>`:'';
    return `<div class="maint part-result"><div class="row"><div><b>${esc(x.name)}</b><div class="muted2">${esc(x.brand||'Производитель не указан')} · ${esc(x.article||'артикул не указан')}</div></div><span class="pill ok">✓ подходит</span></div><div class="muted2">Узел: ${esc(x.nodeName||'—')}</div><div class="actions">${btn}<button class="small secondary" onclick="showPartPrice('${esc(x.article)}','${esc(x.brand)}','${esc(x.name)}')">💰 Цена</button></div></div>`;
   }).join('');
  }
  $('partsResults').innerHTML=html;
 }catch(e){toast('Бесплатный каталог временно недоступен или исчерпал дневную квоту')}
}
async function showPartPrice(article,brand,name){if(!article)return toast('Для этой детали нет артикула');try{const r=await api('/api/parts/free/price-search?'+new URLSearchParams({article,brand,name}));openSheet('💰 Цена детали',`<div class="section-note"><b>${esc(brand||'')} ${esc(article)}</b><br>${esc(name||'Запчасть')}</div><p class="muted">${esc(r.message||'')}</p>${r.averagePrice?`<div class="kpi">${Number(r.averagePrice).toLocaleString('ru-RU')} ₽</div>`:'<div class="empty">Средняя цена пока не подключена к ценовому провайдеру.</div>'}<a href="${esc(r.searchUrl)}" target="_blank" rel="noopener" style="display:inline-block;margin-top:8px">🔎 Посмотреть актуальные цены</a>`)}catch(e){toast('Не удалось получить цену')}}
async function showPartAnalogs(article){try{const r=await api('/api/parts/free/analogs?article='+encodeURIComponent(article));const rows=r.analogs||[];openSheet('Аналоги — '+article,rows.map(x=>`<div class="maint"><div class="row"><b>${esc(x.brand||'Бренд')}</b><span class="pill">${esc(x.article||'—')}</span></div><div>${esc(x.name||'Аналог')}</div><div class="muted2">Связь из базы кросс-номеров${x.confidence?` · рейтинг ${esc(String(x.confidence))}`:''}</div></div>`).join('')||'<div class="empty">Для этой детали аналоги не найдены.</div>')}catch(e){toast('Не удалось получить аналоги')}}
let communityCurrent=null,communityTimer=null;function communities(){const mine=state.cars.map(c=>{const n=`${c.make} ${c.model}`.trim();return `<div class="maint"><b>👥 ${esc(n)}</b><p class="muted">Общее сообщество владельцев марки и модели.</p><button onclick="openCommunity(${JSON.stringify(c.make)},${JSON.stringify(c.model)})">Открыть сообщество</button></div>`}).join('');return `<h1>👥 Сообщества</h1><section class="card"><h2>Мои автомобили</h2>${mine||'<div class="empty">Сначала добавьте автомобиль.</div>'}</section><section class="card"><h2>🔎 Поиск сообщества</h2><input id="communityQ" placeholder="Например, Калина или Opel Astra"><button onclick="searchCommunities()">Найти</button><div id="communityResults" style="margin-top:10px"></div></section>`}async function searchCommunities(){const q=val('communityQ').trim();if(!q)return toast('Введите марку или модель');try{const r=await api('/api/communities?q='+encodeURIComponent(q));$('communityResults').innerHTML=(r.communities||[]).slice(0,30).map(x=>`<div class="maint"><b>👥 ${esc(x.name)}</b><p class="muted2">Общее сообщество владельцев марки и модели.</p><button onclick="openCommunity(${JSON.stringify(x.make)},${JSON.stringify(x.model)})">Открыть</button></div>`).join('')||`<div class="empty">Сообщество ещё не найдено.</div><button class="community-create" onclick="createCommunityFromSearch()">➕ Создать по запросу</button>`}catch(e){toast(e.message)}}async function createCommunityFromSearch(){const q=val('communityQ').trim();if(!q)return;const r=await api('/api/communities/ensure?make='+encodeURIComponent(q.split(/\s+/)[0])+'&model='+encodeURIComponent(q.split(/\s+/).slice(1).join(' ')));openCommunity(r.community.make,r.community.model)}async function openCommunity(make,model){make=String(make||'').trim();model=String(model||'').trim();if(!make||!model)return toast('Не удалось определить марку и модель');communityCurrent={make,model,name:`${make} ${model}`};try{const r=await api('/api/communities/ensure?make='+encodeURIComponent(make)+'&model='+encodeURIComponent(model));communityCurrent.id=r.community.id}catch(e){return toast('Не удалось открыть сообщество')}openSheet('Сообщество — '+communityCurrent.name,`<div id="communityChat" class="card"><div class="muted">Загрузка сообщений…</div></div><label>Ваше сообщение<textarea id="communityText" placeholder="Напишите сообщение владельцам…"></textarea></label><button onclick="sendCommunityMessage()">Отправить</button>`);await loadCommunityMessages();clearInterval(communityTimer);communityTimer=setInterval(loadCommunityMessages,4000)}async function loadCommunityMessages(){if(!communityCurrent||!$('communityChat'))return;try{const r=await api('/api/communities/messages?make='+encodeURIComponent(communityCurrent.make)+'&model='+encodeURIComponent(communityCurrent.model));$('communityChat').innerHTML=(r.messages||[]).map(x=>`<div class="maint"><div class="row"><b>${esc(x.authorName||'Владелец')}</b><span class="muted2">${esc(new Date(x.createdAt).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}))}</span></div><div>${esc(x.text)}</div>${x.replyTo?'<div class="muted2">↪ ответ</div>':''}<button class="small secondary" onclick="replyCommunity('${x.id}')">↩ Ответить</button></div>`).join('')||'<div class="empty">Пока сообщений нет. Будьте первым.</div>'}catch{}}function replyCommunity(id){$('communityText').dataset.replyTo=id;$('communityText').focus()}async function sendCommunityMessage(){const text=val('communityText').trim();if(!text)return toast('Напишите сообщение');if(!communityCurrent?.make||!communityCurrent?.model)return toast('Сначала откройте сообщество');try{await api('/api/communities/messages',{method:'POST',body:JSON.stringify({make:communityCurrent.make,model:communityCurrent.model,text,replyTo:$('communityText').dataset.replyTo||null})});$('communityText').value='';delete $('communityText').dataset.replyTo;await loadCommunityMessages()}catch(e){toast(e.message)}}
function openCarForm(id=''){const c=id?state.cars.find(x=>x.id===id):null;openSheet('Ваш автомобиль',`<div class="section-note"><b>Фото СТС</b> ${infoToggle('stsInfo','Фото СТС помогает заполнить данные автомобиля. После распознавания проверьте поля.')}<input id="fStsPhoto" type="file" accept="image/*" capture="environment" onchange="scanSTSIntoForm(this)"></div><div class="grid"><label>Марка<input id="fMake" value="${esc(c?.make||'')}"></label><label>Модель<input id="fModel" value="${esc(c?.model||'')}"></label><label>Год<input id="fYear" type="number" value="${c?.year||''}"></label><label>Цвет<input id="fColor" value="${esc(c?.color||'')}"></label><label>Госномер<input id="fPlate" value="${esc(c?.plate||'')}"></label><label>VIN<input id="fVin" value="${esc(c?.vin||'')}"></label><label>Номер СТС<input id="fSts" value="${esc(c?.stsNumber||'')}"></label><label>Текущий пробег <span class="danger">обязательно</span><input id="fOdo" type="number" min="0" value="${c?.odometer??''}"></label></div><section class="card"><b>Сохранённое масло</b><div class="grid"><label>Бренд<input id="fOilBrand" value="${esc(c?.oil?.brand||'')}"></label><label>Название / модель<input id="fOilName" value="${esc(c?.oil?.name||'')}"></label><label>Вязкость<input id="fOilViscosity" value="${esc(c?.oil?.viscosity||'')}"></label><label>Объём, л<input id="fOilVolume" type="number" step="0.1" value="${esc(c?.oil?.volume||'')}"></label></div></section><button onclick="saveCarForm('${id}')">Сохранить и продолжить</button>${c?`<button class="secondary" onclick="deleteCar('${id}')">Удалить авто</button>`:''}`)}
async function saveCarForm(id){try{const odo=Number(val('fOdo'));if(!Number.isFinite(odo)||odo<0)return toast('Введите текущий пробег');const b={make:val('fMake'),model:val('fModel'),year:val('fYear'),color:val('fColor'),plate:val('fPlate'),vin:val('fVin'),stsNumber:val('fSts'),odometer:odo,oil:{brand:val('fOilBrand'),name:val('fOilName'),viscosity:val('fOilViscosity'),volume:val('fOilVolume')}};const r=await api(id?'/api/car/'+id:'/api/car',{method:id?'PUT':'POST',body:JSON.stringify(b)});closeSheet();await load();openInitialMaintenance(r.car.id)}catch(e){toast(e.message)}}

async function openInitialMaintenance(carId){const c=state.cars.find(x=>x.id===carId),p=await fillPresets(),selected=initialComposition(c);window._selectedGeneral=selected;openSheet('Настройка автомобиля',`<div class="actions"><button class="secondary small" onclick="openCarForm('${carId}')">← Назад к автомобилю</button></div><div class="section-note"><b>1. Ваш автомобиль</b></div><div class="card"><div class="section-note"><b>2. Текущий пробег</b></div><label>Какой пробег сейчас?<input id="fCurrentOdo" type="number" min="0" value="${Number(c.odometer)}"></label></div><div class="card"><div class="section-note"><b>3. Последнее обслуживание</b></div><label>На каком пробеге было выполнено последнее ТО?<input id="fLastKm" type="number" min="0" value="${Number(c.lastServiceOdometer??c.odometer)}"></label><label>Когда было выполнено последнее ТО?<input id="fLastDate" type="date" value="${esc(c.lastServiceDate||today())}"></label><p><b>Что входило в последнее общее ТО?</b></p>${groupedPresets(p.filter(x=>!x.key.includes('repair')),'generalCheck').replace(/class=\"generalCheck/g,'class=\"generalCheck') }</div><div class="card"><div class="section-note"><b>4. Интервалы</b></div><label>Общий интервал ТО, км ${infoToggle('intervalInfo','Например: 150 000 + 10 000 = следующее ТО на 160 000 км.')}<input id="fGeneralInterval" type="number" min="1" value="${Number(c.serviceIntervalKm||10000)}"></label></div><div class="card"><div class="section-note"><b>5. Напоминание</b></div><label>Напоминать о ТО за, км<select id="fRemKm">${[500,1000,1500,2000,3000].map(n=>`<option ${Number(c.reminderKm||1000)===n?'selected':''}>${n}</option>`).join('')}</select></label><label>Дата следующего ТО <span class="muted">(необязательно)</span><input id="fGeneralDate" type="date" value="${esc(c.nextServiceDate||'')}"></label><label>Если дата задана, напомнить за<select id="fRemDays">${[0,1,2,3,5,10,15].map(n=>`<option value="${n}">${n===0?'Не использовать дату':n+' '+(n===1?'день':'дней')}</option>`) async function saveInitialMaintenance(carId){try{const c=state.cars.find(x=>x.id===carId);if(!c)return toast('Автомобиль не найден');const presets=await fillPresets();const checks=[...document.querySelectorAll('.generalCheck:checked')].map(x=>({key:x.value,name:x.dataset.name}));if(!checks.length)return toast('Выберите хотя бы один пункт последнего ТО');const currentOdo=Number(val('fCurrentOdo'));const lastOdo=Number(val('fLastKm'));if(!Number.isFinite(currentOdo)||currentOdo<Number(c.odometer))return toast('Пробег не может уменьшаться');if(!Number.isFinite(lastOdo)||lastOdo<0||lastOdo>currentOdo)return toast('Пробег последнего ТО не может быть больше текущего пробега');const body={odometer:currentOdo,lastServiceOdometer:lastOdo,lastServiceDate:val('fLastDate'),serviceIntervalKm:Number(val('fGeneralInterval')),nextServiceDate:val('fGeneralDate')||null,reminderKm:Number(val('fRemKm')),reminderDays:val('fGeneralDate')?Number(val('fRemDays')):0,mileageReminder:{enabled:true,mode:val('fMileageMode'),intervalDays:Number(val('fMileageDays')||7),monthlyDay:Number(val('fMileageMonthly')||1)}};await api('/api/car/'+carId,{method:'PUT',body:JSON.stringify(body)});const existing=state.maintenance.filter(m=>m.carId===carId&&m.general);for(const old of existing){if(!checks.some(x=>x.key===(old.presetKey||'')||x.name===old.name))await api('/api/maintenance/'+old.id,{method:'DELETE'})}for(const x of checks){const old=existing.find(m=>(m.presetKey||'')===x.key||m.name===x.name);const payload={name:x.name,presetKey:x.key,group:(presets.find(z=>z.key===x.key)?.group||'other'),general:true,lastDoneOdometer:body.lastServiceOdometer,lastDoneDate:body.lastServiceDate,intervalKm:body.serviceIntervalKm,reminderKm:body.reminderKm,reminderDays:body.reminderDays};if(old)await api('/api/maintenance/'+old.id,{method:'PUT',body:JSON.stringify(payload)});else await api('/api/maintenance',{method:'POST',body:JSON.stringify({carId,...payload})})}closeSheet();toast('Настройки ТО сохранены');await lo async function scanDriverLicense(input){const file=input.files?.[0];if(!file)return;try{toast('Распознаю водительские права…');const out=await Tesseract.recognize(file,'rus+eng');const text=String(out?.data?.text||'').replace(/\s+/g,' ').trim();const up=text.toUpperCase();const nums=(up.match(/\b\d{4}\s?\d{6}\b/)||up.match(/\b\d{10}\b/)||[])[0]||'';if(nums&&$('fDriverLicense'))$('fDriverLicense').value=nums.replace(/(\d{4})(\d{6})/,'$1 $2');const date=(text.match(/\b(\d{2})[.\/](\d{2})[.\/](\d{4})\b/)||[]);if(date.length&&$('fDriverDate'))$('fDriverDate').value=`${date[3]}-${date[2]}-${date[1]}`;const nameLine=text.split(/\n/).map(x=>x.trim()).filter(Boolean).find(x=>/[А-ЯЁ][а-яё]+\s+[А-ЯЁ][а-яё]+/.test(x));if(nameLine&&$('fDriverName'))$('fDriverName').value=nameLine.replace(/[^А-Яа-яЁёA-Za-z .-]/g,' ').replace(/\s+/g,' ').trim();toast('Права распознаны. Проверьте данные перед сохранением.')}catch(e){toast('Не удалось распознать фото прав: '+e.message)}}

async function loadBookings(){try{const r=await api('/api/station/bookings');$('bookings').innerHTML=r.bookings.length?r.bookings.map(b=>`<div class="station"><b>${esc(b.date)} ${esc(b.time)}</b> · ${esc(b.service)}<br><span class="muted">${esc(b.status)}</span></div>`).join(''):'<span class="muted">Нет заявок.</span>'}catch{}}async function initMap(){const el=$('map');if(!el)return;if(!mapsKey){$('mapNote').textContent='Карта Яндекс не подключена: нужен YANDEX_MAPS_JS_API_KEY. Поиск организаций уже работает через Яндекс.';return}if(!window.ymaps){const sc=document.createElement('script');sc.src=`https://api-maps.yandex.ru/2.1/?apikey=${encodeURIComponent(mapsKey)}&lang=ru_RU`;sc.onload=()=>initMap();document.head.appendChild(sc);return}await ymaps.ready();el.innerHTML='';const center=stationResults.find(s=>s.coords)?.coords?[stationResults.find(s=>s.coords).coords.lat,stationResults.find(s=>s.coords).coords.lon]:[55.75,37.61];const map=new ymaps.Map(el,{center,zoom:12,controls:['zoomControl']});stationResults.filter(s=>s.coords).forEach(s=>{const pm=new ymaps.Placemark([s.coords.lat,s.coords.lon],{balloonContent:`<b>${esc(s.name)}</b><br>${esc(s.address)}`},{preset:'islands#blueAutoIcon'});map.geoObjects.add(pm)})}
async function saveSettings(){try{await api('/api/settings',{method:'POST',body:JSON.stringify({enabled:$('enabled').checked,mode:val('mode'),weekday:Number(val('weekday')),monthlyDay:Number(val('monthlyDay')),time:val('time')})});toast('Настройки сохранены');await load()}catch(e){toast(e.message)}}
function printCarReport(){if(!state.cars.length)return toast('Сначала добавьте автомобиль');const selected=val('reportCar');const car=state.cars.find(c=>c.id===selected)||state.cars[0];const services=state.services.filter(s=>s.carId===car.id).sort((a,b)=>String(a.date).localeCompare(String(b.date)));const total=services.reduce((n,s)=>n+Number(s.cost||0),0);const cats={maintenance:'ТО и расходники',repair:'Ремонт',fuel:'Топливо',tires:'Шины',wash:'Мойка',other:'Другое'};const rows=services.map(s=>`<tr><td>${esc(formatDateRU(s.date))}</td><td>${Number(s.odometer||0).toLocaleString('ru-RU')} км</td><td>${esc(s.items?.join(', ')||'—')}</td><td>${esc(cats[s.category]||'Другое')}</td><td>${money(s.cost)}</td><td>${esc(s.note||'')}</td></tr>`).join('');const w=window.open('','_blank');if(!w)return toast('Разрешите всплывающие окна для отчёта');w.document.write(`<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>АвтоПлан — отчёт</title><style>body{font-family:Arial,sans-serif;color:#172033;padding:28px}h1{margin-bottom:4px}.meta{color:#555;margin-bottom:20px}.summary{display:flex;gap:12px;margin:18px 0 24px}.box{border:1px solid #ddd;border-radius:10px;padding:12px 16px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:8px;text-align:left;font-size:12px}th{background:#f1f3f5}@media print{body{padding:0}}</style></head><body onload="setTimeout(function(){window.print()},300)"><h1>АвтоПлан — история автомобиля</h1><div class="meta"><b>${esc(car.name)}</b><br>${esc(car.make)} ${esc(car.model)} ${car.year||''}${car.plate?' · '+esc(car.plate):''}<br>VIN: ${esc(car.vin||'не указан')} · СТС: ${esc(car.stsNumber||'не указан')}</div><div class="summary"><div class="box"><b>Текущий пробег</b><br>${Number(car.odometer||0).toLocaleString('ru-RU')} км</div><div class="box"><b>Записей</b><br>${services.length}</div><div class="box"><b>Расходы</b><br>${money(total)}</div></div><table><thead><tr><th>Дата</th><th>Пробег</th><th>Работы / покупки</th><th>Категория</th><th>Сумма</th><th>Примечание</th></tr></thead><tbody>${rows||'<tr><td colspan="6">История пока пустая</td></tr>'}</tbody></table><p>Отчёт сформирован в приложении АвтоПлан.</p></body></html>`);w.document.close()}async function exportData(){try{const d=await api('/api/export');const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`autoplan-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Резервная копия подготовлена')}catch(e){toast('Не удалось подготовить резервную копию')}}
async function importBackup(input){const file=input.files?.[0];if(!file)return;try{const text=await file.text();const data=JSON.parse(text);if(!Array.isArray(data.cars))throw Error('Файл не похож на резервную копию АвтоПлана');if(!confirm('Восстановление заменит текущие данные этого пользователя. Продолжить?'))return;await api('/api/import',{method:'POST',body:JSON.stringify(data)});toast('Резервная копия восстановлена');await load()}catch(e){toast(e.message||'Не удалось восстановить копию')}finally{input.value=''}}
async function scanSTS(input){await scanSTSIntoForm(input)}
async function scanSTSIntoForm(input){const file=input.files?.[0];if(!file)return;try{toast('Распознаю СТС…');const out=await Tesseract.recognize(file,'rus+eng');const text=out?.data?.text||'';const norm=text.replace(/\s+/g,' ').trim();const upper=norm.toUpperCase();const vin=(upper.match(/\b[A-HJ-NPR-Z0-9]{17}\b/)||[])[0]||'';const plate=(upper.match(/\b[А-ЯA-Z]\s?\d{3}\s?[А-ЯA-Z]{2}\s?\d{2,3}\b/)||[])[0]||'';const year=(norm.match(/\b(?:19|20)\d{2}\b/)||[])[0]||'';if(vin&&$('fVin'))$('fVin').value=vin;if(plate&&$('fPlate'))$('fPlate').value=plate;if(year&&$('fYear'))$('fYear').value=year;const aliases=[['CHEVROLET','CHEVROLET'],['ЛАДА','LADA'],['LADA','LADA'],['RENAULT','RENAULT'],['NISSAN','NISSAN'],['TOYOTA','TOYOTA'],['KIA','KIA'],['HYUNDAI','HYUNDAI'],['VOLKSWAGEN','VOLKSWAGEN'],['SKODA','SKODA'],['FORD','FORD'],['MERCEDES-BENZ','MERCEDES-BENZ'],['MERCEDES','MERCEDES-BENZ'],['BMW','BMW'],['AUDI','AUDI'],['OPEL','OPEL'],['PEUGEOT','PEUGEOT'],['CITROEN','CITROEN'],['MAZDA','MAZDA'],['HONDA','HONDA'],['SUBARU','SUBARU'],['VOLVO','VOLVO'],['CHERY','CHERY'],['HAVAL','HAVAL'],['GEELY','GEELY'],['CHANGAN','CHANGAN'],['EXEED','EXEED'],['OMODA','OMODA'],['JAECOO','JAECOO'],['GAC','GAC'],['KAIYI','KAIYI']];const hit=aliases.find(a=>upper.includes(a[0]));if(hit&&$('fMake'))$('fMake').value=hit[1];if(hit){try{const r=await api('/api/vehicles/models');const model=(r.models||[]).filter(x=>x.make===hit[1]).map(x=>x.model).sort((a,b)=>b.length-a.length).find(m=>upper.includes(String(m).toUpperCase()));if(model&&$('fModel'))$('fModel').value=model}catch{}}const sts=(norm.match(/\b\d{2,4}\s?\d{2,6}\s?\d{4,6}\b/)||[])[0]||'';if(sts&&$('fSts'))$('fSts').value=sts;toast('СТС распознано. Проверьте данные перед сохранением.')}catch(e){toast('Не удалось распознать фото СТС: '+e.message)}}
load().catch(e=>$('app').innerHTML=`<section class="card"><h2>Ошибка запуска</h2>${esc(e.message)}</section>`);
</script></body></html>
